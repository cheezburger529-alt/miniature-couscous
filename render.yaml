services:
  - type: web
    name: stagehost
    runtime: node
    plan: pro
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm run start
    envVars:
      - key: NODE_ENV
        value: production
      - key: ADMIN_PASSWORD
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: stagehost-db
          property: connectionString

databases:
  - name: stagehost-db
    plan: free
